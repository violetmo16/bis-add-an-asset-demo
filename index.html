<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIS Assets - Flow 1 demo (create an asset)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="shell">
  <header class="hdr">
    <div class="hdr-top">
      <button type="button" class="hdr-logo" aria-label="BIS - QAQC Test Environment" data-live data-go="#/list"></button>
      <div class="hdr-sp"></div>
      <div class="hdr-search">
        <input type="search" placeholder="Search User" aria-label="Search user" readonly data-nodemo>
        <button type="button" aria-label="Search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </div>
      <button type="button" class="hdr-ico a" aria-label="Assistant"></button>
      <button type="button" class="hdr-ico h" aria-label="Help"></button>
      <button type="button" class="hdr-ico p" aria-label="Profile"></button>
      <button type="button" class="hdr-out">Log Out <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <nav class="hdr-nav" aria-label="Main">
      <a href="#/x">Home</a><a href="#/x">Profile</a><a href="#/x">Store</a><a href="#/x">Rewards</a><a href="#/x">Purchases</a><a href="#/x">Users</a><a href="#/x">Reporting</a><a href="#/x">Calendar</a><a href="#/list" data-live id="nav-assets">Assets</a><a href="#/x">Folders</a><a href="#/x">QR</a><a href="#/x">Admin</a>
      <button type="button" class="hdr-info" aria-label="Help">i</button>
    </nav>
  </header>
  <div id="app"></div>
</div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
<div id="overlay"></div>
<div id="toasts" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
